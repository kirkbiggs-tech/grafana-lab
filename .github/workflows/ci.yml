name: Grafana Lab CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
jobs:
  test:
    name: Test health-check scripts
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Validate Bash syntax
        run: |
          bash -n scripts/health-check.sh
          bash -n scripts/test-health-check.sh

      - name: Run automated tests
        run: ./scripts/test-health-check.sh
      - name: Build Docker image
        run: docker build -t grafana-lab-status:ci docker/
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: grafana-lab-status:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Run container smoke test
        run: |
          docker run -d --rm --name grafana-lab-status-ci -p 8080:80 grafana-lab-status:ci
          sleep 3
          curl --fail --silent http://localhost:8080 | grep "Status: Running"
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified container image
        if: github.event_name == 'push'
        run: |
          docker tag grafana-lab-status:ci ghcr.io/kirkbiggs-tech/grafana-lab-status:${{ github.sha }}
          docker tag grafana-lab-status:ci ghcr.io/kirkbiggs-tech/grafana-lab-status:latest
          docker push ghcr.io/kirkbiggs-tech/grafana-lab-status:${{ github.sha }}
          docker push ghcr.io/kirkbiggs-tech/grafana-lab-status:latest
