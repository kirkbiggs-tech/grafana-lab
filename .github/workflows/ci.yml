name: Grafana Lab CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test health-check scripts
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Validate Bash syntax
        run: |
          bash -n scripts/health-check.sh
          bash -n scripts/test-health-check.sh

      - name: Run automated tests
        run: ./scripts/test-health-check.sh
      - name: Build Docker image
        run: docker build -t grafana-lab-status:ci docker/

      - name: Run container smoke test
        run: |
          docker run -d --rm --name grafana-lab-status-ci -p 8080:80 grafana-lab-status:ci
          sleep 3
          curl --fail --silent http://localhost:8080 | grep "Status: Running"
